<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>AI 承接原型 · 可点交互</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#eef2f0; color:#111; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
  .app { width:1580px; margin:0 auto; padding:20px 24px 40px; display:grid; grid-template-columns:238px 1fr 340px; gap:20px; align-items:start; }
  .panel { background:#fff; border:1px solid #e6ece9; border-radius:16px; padding:16px; }
  .panel + .panel { margin-top:14px; }
  .ttl { font-size:15px; font-weight:800; margin-bottom:10px; }
  .muted { font-size:12.5px; color:#7d8a83; line-height:1.6; }

  /* ---------- 左栏：场景与开关 ---------- */
  .scene-btn { width:100%; text-align:left; border:1px solid #e6ece9; background:#fff; border-radius:11px; padding:9px 11px; font-size:13.5px;
               cursor:pointer; margin-bottom:7px; font-family:inherit; color:#111; }
  .scene-btn small { display:block; font-size:11.5px; color:#8a9691; margin-top:3px; }
  .scene-btn:hover { border-color:#bde8d1; }
  .scene-btn.on { border-color:#12a35f; background:#f2fbf6; }
  .scene-btn.on b { color:#0a8a52; }
  .sw { display:flex; align-items:center; gap:9px; font-size:13px; padding:7px 0; cursor:pointer; }
  .sw input { width:16px; height:16px; accent-color:#12a35f; }
  .seg { display:flex; gap:6px; margin-top:4px; }
  .seg button { flex:1; border:1px solid #e6ece9; background:#fff; border-radius:9px; padding:7px 0; font-size:13px; cursor:pointer; font-family:inherit; }
  .seg button.on { border-color:#12a35f; background:#f2fbf6; color:#0a8a52; font-weight:700; }

  /* ---------- 中栏：两台手机 ---------- */
  .phones { display:flex; gap:22px; justify-content:center; }
  .devwrap { width:390px; }
  .devcap { font-size:13px; font-weight:800; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .devcap i { font-style:normal; font-size:11px; font-weight:700; border-radius:7px; padding:2px 8px; }
  .devcap .now i { color:#5a6a62; background:#eef1ef; }
  .devcap .next i { color:#fff; background:#12a35f; }
  .dev { position:relative; width:390px; height:844px; border-radius:42px; background:#fff; border:1px solid #dbe3df;
         box-shadow:0 16px 40px rgba(20,50,35,.12); overflow:hidden; }
  .screen { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; padding-bottom:118px; scroll-behavior:auto; }
  .screen::-webkit-scrollbar { width:0; }
  .bottom { position:absolute; left:0; right:0; bottom:0; z-index:9; }
  .empty-note { position:absolute; inset:0; background:#f7faf8; display:flex; align-items:center; justify-content:center;
                text-align:center; font-size:14px; color:#7d8a83; line-height:1.8; padding:0 40px; z-index:20; }

  /* ---------- 手机通用 ---------- */
  .statusbar { display:flex; align-items:center; justify-content:space-between; padding:13px 22px 8px; font-size:13.5px; font-weight:600; }
  .statusbar .mid { display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; }
  .logo-dot { width:13px; height:13px; border-radius:4px; background:linear-gradient(135deg,#ff7a45,#ff4d2e); }
  .statusbar .right { display:flex; align-items:center; gap:6px; font-size:12px; }
  .bars { display:flex; align-items:flex-end; gap:2px; height:10px; }
  .bars i { width:3px; background:#111; border-radius:1px; display:block; }
  .bars i:nth-child(1){height:4px} .bars i:nth-child(2){height:6px} .bars i:nth-child(3){height:8px} .bars i:nth-child(4){height:10px}
  .batt { width:22px; height:11px; border:1.3px solid #111; border-radius:3px; position:relative; }
  .batt::after { content:""; position:absolute; right:-3px; top:3px; width:2px; height:5px; background:#111; border-radius:0 1px 1px 0; }
  .batt i { position:absolute; inset:1.5px; width:62%; background:#34c759; border-radius:1px; display:block; }
  .top { position:sticky; top:0; z-index:7; background:linear-gradient(180deg,#e9f8ef 0%, #f2fbf5 62%, #ffffff 100%); }
  .searchrow { display:flex; align-items:center; gap:11px; height:64px; padding:0 18px; background:transparent; }
  .back { font-size:23px; line-height:1; }
  .searchbox { flex:1; height:44px; border:2px solid #111; border-radius:22px; display:flex; align-items:center; padding:0 17px;
               font-size:15.5px; font-weight:500; background:#fff; white-space:nowrap; overflow:hidden; }
  .dots { font-size:19px; letter-spacing:2px; }
  .titlerow { display:flex; align-items:center; gap:9px; height:64px; padding:0 18px; background:transparent; }
  .titlerow .pttl { font-size:19px; font-weight:700; }
  .titlerow .dots { margin-left:auto; }
  .tabs { display:flex; align-items:center; gap:21px; padding:0 20px; font-size:15.5px; overflow:hidden; }
  .tab { color:#333; font-weight:500; position:relative; white-space:nowrap; flex:0 0 auto; }
  .tab.on { color:#08331f; font-weight:800; font-size:17px; z-index:1; }
  .tab.on::before { content:""; position:absolute; left:-9px; right:-9px; top:-4px; bottom:-4px; background:#a9e8c4; border-radius:10px; z-index:-1; }
  .tab.on::after { content:""; position:absolute; left:50%; bottom:-11px; width:20px; height:3px; margin-left:-10px; border-radius:2px; background:#12a35f; }
  .tab.ai { color:#0a8a52; font-weight:700; background:#fff; border:1.6px solid #bde8d1; border-radius:15px;
            padding:4px 12px; font-size:13.5px; display:flex; align-items:center; gap:4px; flex:0 0 auto; }
  .tab.ai.on { color:#fff; background:#12a35f; border-color:#12a35f; z-index:1; }
  .tab.ai.on::before { display:none; }
  .tab.ai.on::after { content:""; position:absolute; left:50%; bottom:-11px; width:20px; height:3px; margin-left:-10px; border-radius:2px; background:#12a35f; }
  .body { padding:16px 20px 0; }

  /* ---------- 图片占位 ---------- */
  .thumb { position:relative; overflow:hidden; border-radius:11px; flex:0 0 auto;
           background:linear-gradient(180deg,#cfe6f5 0%,#e6f2fb 54%,#dcecdd 54%,#eef7ea 100%); }
  .thumb::before { content:""; position:absolute; left:16%; top:15%; width:19%; height:19%; border-radius:50%; background:rgba(255,255,255,.82); }
  .thumb::after { content:""; position:absolute; left:-8%; bottom:3%; width:116%; height:31%;
                  border-radius:50% 50% 0 0; background:linear-gradient(180deg,rgba(108,168,128,.6),rgba(108,168,128,.24)); }
  .thumb.warm { background:linear-gradient(180deg,#fbe6cd 0%,#fdf1e2 54%,#e8dcc4 54%,#f5efe0 100%); }
  .thumb.warm::after { background:linear-gradient(180deg,rgba(186,146,86,.55),rgba(186,146,86,.2)); }
  .thumb.cool { background:linear-gradient(180deg,#d6e3f6 0%,#eaf1fb 54%,#dbe6f0 54%,#eff4fa 100%); }
  .thumb.cool::after { background:linear-gradient(180deg,rgba(108,140,190,.5),rgba(108,140,190,.18)); }
  .thumb.hotel { background:linear-gradient(180deg,#e4ebf4,#f5f8fc); }
  .thumb.hotel::before { left:26%; top:30%; width:48%; height:66%; border-radius:5px 5px 0 0; background:#c6d4e5; }
  .thumb.hotel::after { left:33%; top:40%; width:34%; height:48%; border-radius:2px;
    background:repeating-linear-gradient(90deg,#eff5fb 0 5px,rgba(0,0,0,0) 5px 11px),
               repeating-linear-gradient(0deg,#eff5fb 0 4px,rgba(0,0,0,0) 4px 9px); }
  /* feed 卡左上角的类型标（攻略 / 景点 / 酒店 / 门票…，对齐线上的卡面样式） */
  .thumb i.ctag { position:absolute; left:6px; top:6px; z-index:2; font-style:normal; font-size:10px; font-weight:700;
                  color:#243029; background:rgba(255,255,255,.92); border-radius:6px; padding:2px 7px; }

  /* ---------- 要点标 ---------- */
  .ptitle { font-size:23px; font-weight:800; letter-spacing:-.3px; }
  .ptitle span { font-size:13px; font-weight:500; color:#8fae9c; margin-left:7px; }
  .pchips { display:flex; gap:7px; margin-top:12px; flex-wrap:wrap; }
  .pchip { font-size:13px; border:1px solid #e8ecea; border-radius:10px; padding:7px 11px; background:#fff; color:#2c3a33; white-space:nowrap; }
  .plabel { margin-top:17px; font-size:16px; font-weight:800; }
  .plabel small { font-weight:500; color:#9aa8a1; font-size:12px; margin-left:6px; }
  .ppoi { border:1px solid #eef1ef; border-radius:13px; padding:13px; background:#fff; }
  .ppoi .n { font-size:17px; font-weight:800; display:flex; align-items:center; }
  .ppoi .n i { font-style:normal; font-size:11px; font-weight:700; color:#fff; background:#e2560c; border-radius:4px; padding:1px 6px; margin-left:6px; }
  .ppoi .m { font-size:12.5px; color:#8a9691; margin-top:7px; line-height:1.5; }
  .ppoi .b { font-size:12px; color:#c0641e; background:#fff1e4; border-radius:5px; padding:4px 8px; display:inline-block; margin-top:8px; }
  .ppoi .p { display:flex; align-items:center; margin-top:11px; }
  .ppoi .p b { font-size:17px; color:#ff4d2e; font-weight:800; }
  .ppoi .p b small { font-size:11px; font-weight:500; }
  .ppoi .p span { margin-left:auto; font-size:12.5px; font-weight:700; color:#fff; background:#12a35f; border-radius:13px; padding:6px 14px; }
  /* 景区头部卡内的五个功能入口：同一排、带 icon */
  .pentries { display:flex; margin-top:13px; padding-top:12px; border-top:1px solid #f2f5f3; }
  .pe { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; }
  .pe .pi { font-size:19px; line-height:1; }
  .pe .pt { font-size:11.5px; color:#2c3a33; white-space:nowrap; }
  .ticket { display:flex; align-items:center; margin-top:9px; font-size:13px; }
  .ticket b { color:#ff4d2e; font-weight:800; margin-left:6px; }
  .ticket em { font-style:normal; margin-left:auto; font-size:12px; font-weight:700; color:#12a35f; }
  .prow { display:flex; gap:10px; margin-top:12px; align-items:flex-start; }
  .prow .thumb { width:60px; height:60px; }
  .prow .li { flex:1; min-width:0; }
  .prow .li .a { font-size:13.5px; font-weight:700; line-height:1.35; }
  .prow .li .b { font-size:12px; color:#8a9691; margin-top:4px; }
  .prow .pr { font-size:14.5px; font-weight:800; color:#ff4d2e; flex:0 0 auto; }

  /* ---------- AI 卡 ---------- */
  .aicard { margin:0 0 4px; border-radius:15px; background:linear-gradient(100deg,#e6f8ec,#f4fdf7); border:1px solid #cdefd9; padding:14px; }
  .aicard .h { display:flex; align-items:center; gap:8px; }
  .aicard .h .ava { width:30px; height:30px; border-radius:9px; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; flex:0 0 auto; }
  .aicard .h .tt { font-size:15.5px; font-weight:800; }
  .aicard .h .tag { margin-left:auto; font-size:11px; font-weight:700; color:#0a8a52; background:#fff; border-radius:7px; padding:3px 8px; white-space:nowrap; }
  .aicard .ans { margin-top:10px; font-size:13px; line-height:1.66; color:#243029; }
  .aicard .ans b { font-weight:800; }
  .aicard .dline { display:flex; gap:8px; margin-top:8px; font-size:12.5px; line-height:1.5; color:#2c3a33; }
  .aicard .dline .day { font-weight:800; color:#0a8a52; flex:0 0 auto; }
  .aicard .dline .hint { color:#8a9691; }
  .aicard .meta { margin-top:10px; font-size:12px; color:#4f8f6b; }
  .aicard .btn { margin-top:11px; height:38px; border-radius:19px; background:#111; color:#fff; font-size:13.5px; font-weight:700;
                 display:flex; align-items:center; justify-content:center; gap:4px; }
  /* 线上版 AI 卡（已有 AI 回复的场景）：白底 + 灰标 + 两张图 + 参考来源 */
  .aicard.nowver { background:#fff; border-color:#e6ebe8; }
  .aicard .tag.gray { color:#7d8a83; background:#f2f5f3; border-color:#e8ecea; }
  .aiimgs { display:flex; gap:10px; margin-top:12px; }
  .aiimgs .thumb { width:calc(50% - 5px); height:98px; }
  .aisrc { display:flex; align-items:center; gap:9px; margin-top:12px; padding-top:11px; border-top:1px solid #eef1ef; }
  .aisrc .thumb { width:46px; height:46px; border-radius:9px; }
  .aisrc .st { font-size:12.5px; font-weight:800; color:#3c4a44; }
  .aisrc .sd { font-size:11.5px; color:#8a9691; margin-top:3px; }
  /* 卡片里的文案不长出来：超长就用省略号缩略，想看完整点「查看全部」去 AI tab */
  .aicard .ans { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; }
  .aicard .ans.first { -webkit-line-clamp:4; }      /* 置顶（首位）的卡多露一行 */
  .aicard .ans.nowver { -webkit-line-clamp:6; }     /* 线上那张原文卡本来就长 */
  .airel { margin-top:12px; border-top:1px solid #e2f2e8; padding-top:10px; }
  .airel .rhead { font-size:12px; font-weight:800; color:#4f8f6b; }
  .airel .rr { display:flex; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid #eef7f1; cursor:pointer; }
  .airel .rr:last-child { border-bottom:0; }
  .airel .rr .thumb { width:44px; height:44px; border-radius:9px; }
  .airel .rr .li { flex:1; min-width:0; }
  .airel .rr .a { font-size:13px; font-weight:700; color:#243029; line-height:1.35; }
  .airel .rr .b { font-size:11.5px; color:#8a9691; margin-top:3px; }
  .airel .rr .pr { font-size:13.5px; font-weight:800; color:#ff4d2e; flex:0 0 auto; }

  /* ---------- 地图卡 ---------- */
  .mapcard { margin:12px 0 0; border:1px solid #e6ecea; border-radius:15px; background:#fff; overflow:hidden; }
  .maphead { display:flex; align-items:center; padding:11px 13px 0; }
  .maphead .mt { font-size:14px; font-weight:800; }
  .maphead .mo { margin-left:auto; font-size:12.5px; font-weight:700; color:#0a8a52; }
  .mapmeta { padding:4px 13px 9px; font-size:12px; color:#8a9691; }
  .mapview { position:relative; height:96px; border-top:1px solid #eef2f0; overflow:hidden; }
  .mapsvg { display:block; width:100%; height:96px; }
  .maplegend { position:absolute; right:9px; bottom:8px; display:flex; gap:9px; align-items:center;
               background:rgba(255,255,255,.88); border-radius:8px; padding:4px 8px; font-size:10.5px; color:#4a5a53; }
  .maplegend span { display:flex; align-items:center; gap:3px; }
  .maplegend i { width:7px; height:7px; border-radius:50%; display:block; }
  .maplegend i.h { background:#2f6ef2; } .maplegend i.s { background:#f5821f; } .maplegend i.t { background:#12a35f; }

  /* ---------- 大家都在问（弹幕板） ---------- */
  .askboard { margin:12px 0 0; border:1.5px solid #bfe7cf; border-radius:17px; background:#f8fdfa; padding:13px 0; }
  .askhead { padding:0 14px; font-size:15.5px; font-weight:800; color:#0a8a52; display:flex; align-items:center; gap:6px; }
  .askhead b { color:#12a35f; font-size:14px; }
  .marquee { overflow:hidden; margin-top:9px;
             -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0,#000 16px,#000 calc(100% - 16px),rgba(0,0,0,0) 100%);
             mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0,#000 16px,#000 calc(100% - 16px),rgba(0,0,0,0) 100%); }
  .marquee .track { display:flex; gap:8px; width:max-content; animation:marq 17s linear infinite; }
  .marquee.rev .track { animation-direction:reverse; animation-duration:20s; }
  @keyframes marq { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  .qchip { display:flex; align-items:center; gap:5px; font-size:13px; color:#243029; background:#fff;
           border:1px solid #d8eee1; border-radius:15px; padding:8px 13px; white-space:nowrap; cursor:pointer; }
  .qchip i { font-style:normal; color:#12a35f; font-weight:800; }

  /* ---------- 双列瀑布 feed ---------- */
  .feed2 { margin-top:11px; column-count:2; column-gap:11px; }
  .fcard { break-inside:avoid; margin-bottom:11px; }
  .fcard .thumb { display:block; width:100%; height:96px; }
  .fcard .ft { font-size:13.5px; font-weight:700; line-height:1.36; margin-top:7px; }
  .fcard .fm { font-size:12px; color:#8a9691; margin-top:4px; }
  .fcard .fp { font-size:14px; font-weight:800; color:#ff4d2e; margin-top:4px; }

  /* ---------- 现在：字面召回的交通方案 ---------- */
  .rectrans { margin-top:11px; border:1px solid #d9eee2; border-radius:14px; background:#f1fbf5; padding:5px 12px; }
  .rectrans .rt { display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid #e3f2e9; font-size:13.5px; }
  .rectrans .rt:last-child { border-bottom:0; }
  .rectrans .rt .ln { font-weight:700; color:#0a8a52; }
  .rectrans .rt .pr { margin-left:auto; font-weight:800; color:#ff4d2e; }
  .rectrans .rt .go { color:#12a35f; font-weight:800; }

  /* ---------- 攻略笔记卡（双列瀑布 · 小红书式） ---------- */
  .notes { margin-top:11px; column-count:2; column-gap:11px; }
  .note { break-inside:avoid; margin-bottom:13px; }
  /* 封面占位：position/overflow 必须放在基类上，否则 ::before 会以 .screen 为参照铺满整屏 */
  .cover { position:relative; overflow:hidden; border-radius:11px; }
  .note .cover { width:100%; height:112px; }
  .note .cover i { position:absolute; left:7px; bottom:7px; font-style:normal; font-size:10px; font-weight:700; color:#fff;
                   background:rgba(0,0,0,.42); border-radius:5px; padding:2px 7px; }
  .note .nt { font-size:13.5px; font-weight:700; line-height:1.36; margin-top:7px; }
  .note .nm { display:flex; align-items:center; gap:5px; font-size:11.5px; color:#8a9691; margin-top:7px; }
  .note .nm .av { width:15px; height:15px; border-radius:50%; background:linear-gradient(135deg,#dbe6f0,#cfe0d6); flex:0 0 auto; }
  .note .nm .lk { margin-left:auto; }
  /* 封面占位图（攻略向，和商品卡区分开） */
  .cover.pack { background:linear-gradient(180deg,#eef2ef,#e2e8e4); }
  .cover.pack::before { content:""; position:absolute; inset:0; background-repeat:no-repeat;
    background-image:linear-gradient(#ccd5d0,#ccd5d0),linear-gradient(#c3cfe4,#c3cfe4),linear-gradient(#e5d7c4,#e5d7c4),
                     linear-gradient(#d6cdc0,#d6cdc0),linear-gradient(#c7d5ca,#c7d5ca),linear-gradient(#e2d2d7,#e2d2d7);
    background-size:36% 30%,26% 22%,30% 20%,22% 26%,28% 26%,24% 18%;
    background-position:8% 14%,60% 8%,34% 44%,74% 42%,10% 70%,62% 72%; }
  .cover.paper { background:linear-gradient(180deg,#e9f2ec,#dde9e1); }
  .cover.paper::before { content:""; position:absolute; left:13%; right:13%; top:16%; bottom:16%; background:#fff; border-radius:7px;
    background-image:repeating-linear-gradient(#eef1ef 0 2px,rgba(0,0,0,0) 2px 12px); }
  .cover.paper::after { content:"✓"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:#12a35f; font-size:22px; font-weight:800; }
  .cover.paper.cool { background:linear-gradient(180deg,#e6effa,#dbe7f6); }
  .cover.paper.cool::after { content:"🎒"; font-size:18px; }
  .cover.suit { background:linear-gradient(180deg,#f6ead9,#eee0cd); }
  .cover.suit::before { content:""; position:absolute; left:16%; top:26%; width:68%; height:54%; border-radius:9px; border:2px solid #cbb394;
    background:linear-gradient(180deg,#e8d8c4,#dcc7ae); }
  .cover.suit::after { content:""; position:absolute; left:44%; top:17%; width:12%; height:11%; border:2px solid #b9a184; border-bottom:0; border-radius:5px 5px 0 0; }
  .cover.city { background:linear-gradient(180deg,#bfe0f5 0%,#dceff9 52%,#f1e3c9 52%,#f7ecd8 100%); }
  .cover.city::before { content:""; position:absolute; right:14%; top:15%; width:15%; height:15%; border-radius:50%; background:rgba(255,255,255,.85); }
  .cover.city::after { content:""; position:absolute; left:-6%; bottom:8%; width:112%; height:24%; border-radius:50% 50% 0 0; background:rgba(212,178,118,.5); }
  .cover.pack.cool { background:linear-gradient(180deg,#e8f0ea,#dbe7e0); }

  /* ---------- 底部：胶囊（固定） ---------- */
  .tray { padding:10px 20px 22px; display:flex; justify-content:center;
          background:linear-gradient(180deg,rgba(255,255,255,0) 0%,#fff 58%); }
  .capsule { height:46px; border-radius:23px; background:#fff; border:1.6px solid #b3e5c9; display:flex; align-items:center;
             gap:8px; padding:0 13px 0 6px; box-shadow:0 8px 20px rgba(18,163,95,.2); cursor:pointer; }
  .capsule .ava { width:34px; height:34px; border-radius:10px; background:#e8fdef; display:flex; align-items:center; justify-content:center; overflow:hidden; }

  @keyframes slideInL { from { transform:translateX(-26px); opacity:.45; } to { transform:none; opacity:1; } }
  @keyframes fadeIn   { from { opacity:.4; } to { opacity:1; } }
  @keyframes popIn    { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  .content.animR { animation:slideInR .26s cubic-bezier(.22,.7,.3,1); }
  .content.animL { animation:slideInL .26s cubic-bezier(.22,.7,.3,1); }

  .page.animF { animation:fadeIn .22s ease; }
  /* 换页时：只有内容区 + 头部那一行（搜索框/标题）+ 底部渐变；tab 栏与状态栏不动 */

          font-size:12px; font-weight:800; color:#fff; background:linear-gradient(180deg,#ff8a5b,#f5502e); }

  /* 行程服务卡（场站） */

<body>
<div class="app">
  <div class="left">
    <div class="panel">
      <div class="ttl">场景</div>
      <div id="scenes"></div>
    </div>
    <div class="panel">
      <div class="ttl">开关</div>
      <label class="sw"><input type="checkbox" id="swHot">显示热区</label>
      <label class="sw"><input type="checkbox" id="swCtx" checked>显示上下文包</label>
      <label class="sw"><input type="checkbox" id="swTicket" checked>已订票（仅场站生效）</label>
      <div style="margin-top:8px">
        <div class="sw" style="padding-bottom:2px">返回行为</div>

          <button data-ret="A" class="on">A 直接退出</button>
          <button data-ret="B">B 回上个 tab</button>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="ttl">怎么用</div>
      <div class="muted">右侧手机里的<b>虚线框</b>都是可点的。走一遍后看右下角日志——它记下每一步去了哪、带了什么上下文。</div>
    </div>
  </div>

  <div class="phones">
    <div class="devwrap">
      <div class="devcap now"><i>现在</i>线上落地页（只读）</div>
      <div class="dev" id="devNow"></div>
    </div>
    <div class="devwrap">
      <div class="devcap next"><i>以后</i>点这里走路径</div>
      <div class="dev" id="devNext"></div>
    </div>
  </div>

  <div class="right">
    <div class="panel">
      <div class="ttl">当前状态</div>
      <div class="nowstate" id="stateName">—</div>
      <div id="ctxWrap"><div class="ctxbox" id="ctxBox"></div></div>
    </div>
    <div class="panel">
      <div class="ttl">路径日志</div>
      <div class="log" id="log"><div class="muted">还没有操作。从右侧手机里点一个虚线框开始。</div></div>
    </div>

</div>
<script>
/* ================= 手机壳 ================= */
const STATUS = '<div class="statusbar"><div>19:18</div><div class="mid"><span class="logo-dot"></span>同程旅行</div>'
  + '<div class="right"><span class="bars"><i></i><i></i><i></i><i></i></span><span class="batt"><i></i></span></div></div>';

const TABS = (entry) => entry
  ? '<div class="tabs"><div class="tab ai hot" data-ai="1" data-say="点 tab 栏「AI」">✦ AI</div>'
    + '<div class="tab on">综合</div><div class="tab">酒店</div><div class="tab">景点</div><div class="tab">旅游</div><div class="tab">攻略</div></div>'
  : '<div class="tabs"><div class="tab on">综合</div><div class="tab">酒店</div><div class="tab">景点</div><div class="tab">旅游</div><div class="tab">攻略</div></div>';

const topSearch = (q, entry) => '<div class="top">' + STATUS
  + '<div class="searchrow"><div class="back hot" data-back="1">‹</div><div class="searchbox">' + q + '</div><div class="dots">•••</div></div>'
  + TABS(entry) + '</div>';

const topAI = (title, back) => '<div class="top">' + STATUS
  + '<div class="titlerow"><div class="back hot" data-back="1">‹</div><div class="pttl">' + title + '</div><div class="dots">•••</div></div>'
  + '<div class="tabs"><div class="tab ai on">✦ AI</div><div class="tab hot" data-go="' + back + '" data-say="切回「综合」tab">综合</div>'
  + '<div class="tab">酒店</div><div class="tab">景点</div><div class="tab">旅游</div><div class="tab">攻略</div></div></div>';

const capsule = () => '<div class="bottom"><div class="tray"><div class="capsule hot" data-ai="1" data-say="点底部「问一问」">'
  + '<div class="ava">🤖</div><div class="txt">问一问</div><div class="chev">›</div></div></div></div>';

const inputbar = '<div class="bottom"><div class="ipbar"><div class="voice">🎙</div>'
  + '<div class="ipbox">发消息或按住说话…</div><div class="ipico">◎</div><div class="ipico">＋</div></div>'
  + '<div class="ipnote">原型示意：输入框不做输入响应</div></div>';

const PLABEL = (t, s) => '<div class="plabel">' + t + (s ? '<small>' + s + '</small>' : '') + '</div>';
const META = (meta) => '<div class="mapmeta">' + meta + '</div>';
const hu = (go, say) => ' class="hot" data-go="' + go + '" data-say="' + say + '"';

/* ================= 通用组件 ================= */
const MAPSVG = '<div class="mapview"><svg class="mapsvg" viewBox="0 0 350 96">'
  + '<rect width="350" height="96" fill="#eaf1ee"/>'
  + '<path d="M0 0h350v24L0 36Z" fill="#f7fbf9"/><path d="M0 96V70l350-12v38Z" fill="#f4f9f6"/>'
  + '<path d="M-10 76C80 70 180 56 360 44" stroke="#fff" stroke-width="8" fill="none"/>'
  + '<path d="M60-8C92 30 120 60 146 104" stroke="#f7dca1" stroke-width="7" fill="none"/>'
  + '<path d="M238-8C244 26 258 56 274 104" stroke="#fff" stroke-width="6" fill="none"/>'
  + '<g fill="#a7b3ad" font-size="10"><text x="16" y="56" transform="rotate(-6 16 56)">东三环</text>'
  + '<text x="196" y="24" transform="rotate(4 196 24)">建国路</text><text x="96" y="90" transform="rotate(-8 96 90)">广渠路</text></g>'
  + '<circle cx="72" cy="40" r="9" fill="#2f6ef2"/><circle cx="90" cy="32" r="9" fill="#2f6ef2"/>'
  + '<circle cx="168" cy="34" r="9" fill="#12a35f"/><circle cx="228" cy="28" r="9" fill="#f5821f"/>'
  + '</svg><div class="maplegend"><span><i class="s"></i>景点</span><span><i class="h"></i>酒店</span><span><i class="t"></i>交通</span></div></div>';

const mapCard = (t, meta) => '<div class="mapcard"><div class="maphead"><div class="mt">' + t + '</div>'
  + '<div class="mo hot" data-go="S7" data-say="点「打开地图」">打开地图 ›</div></div>' + META(meta) + MAPSVG + '</div>';

const feed2 = (cards) => '<div class="feed2">' + cards.map(c =>
  '<div class="fcard hot" data-go="S6" data-say="点 feed 卡片「' + c[1] + '」">'
  + '<div class="thumb ' + c[0] + '">' + (c[4] ? '<i class="ctag">' + c[4] + '</i>' : '') + '</div>'
  + '<div class="ft">' + c[1] + '</div><div class="fm">' + c[2] + '</div>'
  + (c[3] ? '<div class="fp">' + c[3] + '</div>' : '') + '</div>').join('') + '</div>';

/* 攻略笔记（双列瀑布，点进攻略详情 S9） */
const notes2 = (notes) => '<div class="notes">' + notes.map(n =>
  '<div class="note hot" data-go="S9" data-note="' + n[1] + '" data-note-author="' + n[2] + '" data-note-like="' + n[4] + '"'
  + ' data-note-cover="' + n[0] + '"'
  + ' data-say="点攻略笔记「' + n[1] + '」">'
  + '<div class="cover ' + n[0] + '"><i>' + n[3] + '</i></div><div class="nt">' + n[1] + '</div>'
  + '<div class="nm"><span class="av"></span><span>' + n[2] + '</span><span class="lk">♡ ' + n[4] + '</span></div></div>').join('') + '</div>';

/* 现在：按 query 切词召回的交通方案 */
const recTrans = (rows) => '<div class="rectrans">' + rows.map(r =>
  '<div class="rt hot" data-go="S6" data-say="点交通方案「' + r[0] + '」">'
  + '<span class="ln">' + r[0] + '</span><span class="pr">' + r[1] + '</span><span class="go">›</span></div>').join('') + '</div>';

const prows = (rows) => rows.map(r =>
  '<div class="prow hot" data-go="S6" data-say="点「' + r[1] + '」"><div class="thumb ' + r[0] + '"></div>'
  + '<div class="li"><div class="a">' + r[1] + '</div><div class="b">' + r[2] + '</div></div><div class="pr">' + r[3] + '</div></div>').join('');

/* 内容行（攻略 / 清单笔记：有作者和互动量，没有价格） */
const noteRows = (rows) => rows.map(r =>
  '<div class="prow hot" data-go="S9" data-note="' + r[1] + '" data-note-author="' + r[2] + '" data-note-like="' + r[3] + '" data-note-cover="' + r[0] + '"'
  + ' data-say="点攻略「' + r[1] + '」"><div class="cover ' + r[0] + '" style="width:52px;height:52px;border-radius:9px"></div>'
  + '<div class="li"><div class="a">' + r[1] + '</div><div class="b">' + r[2] + ' · 攻略</div></div>'
  + '<div class="pr" style="color:#8a9691;font-size:12.5px">♡ ' + r[3] + '</div></div>').join('');

const planCard = (r) => '<div class="plancard hot" data-go="S3" data-say="点「' + r[0] + '」">'
  + '<div class="ph">' + r[0] + '<span>AI 生成</span></div><div class="pd">' + r[1] + '</div>'
  + '<div class="pf">' + r[2] + '<b>查看 ›</b></div></div>';

const askboard = (c) => '<div class="askboard"><div class="askhead">大家都在问 <b>✦</b></div>'
  + [c.asks.slice(0, 3), c.asks.slice(3, 6)].map((r, i) => '<div class="marquee' + (i ? ' rev' : '') + '"><div class="track">'
    + r.concat(r).map(q => '<span class="qchip hot" data-s2="ask" data-q="' + q + '" data-say="点问题 chip「' + q + '」">' + q + '<i>›</i></span>').join('')
    + '</div></div>').join('') + '</div>';

const ppoiCard = (id) => {
  const c = SC[id].card;
  return '<div class="ppoi"><div class="n">' + c.name + '<i>' + c.badge + '</i></div>'
    + '<div class="m">' + c.meta + '</div>' + (c.tag ? '<div class="b">' + c.tag + '</div>' : '')
    + (c.addr ? '<div class="m">📍 ' + c.addr + '</div>' : '')
    + '<div class="p"><b>' + c.price + '<small>起</small></b>'
    + '<span class="hot" data-go="S6" data-say="点「查看详情」">查看详情</span></div>'
    + '<div class="pentries">' + c.entries.map(e =>
        '<div class="pe hot" data-go="S6" data-say="点入口「' + e[1] + '」"><span class="pi">' + e[0] + '</span><span class="pt">' + e[1] + '</span></div>'
      ).join('') + '</div></div>';
};

const boards = (id) => {
  const b = SC[id].boards;
  return '<div class="boards">' + b.map(bd => '<div class="board">'

const aicardHTML = (id, btnLabel, nowMode) => {
  const c = SC[id];
  const a = (nowMode && c.nowAi) ? c.nowAi : c.ai;
  /* 置顶场景（aiFirst）用"首位版"：答案多露一点 + 参考图 + 关联资源，过长折叠 */
  const first = !nowMode && !!c.aiFirst && !a.dlines;
  let body = '';
  if (a.dlines) {
    body = a.dlines.map(d => '<div class="dline"><span class="day">' + d[0] + '</span><span>' + d[1] + '</span><span class="hint">' + d[2] + '</span></div>').join('')
      + (a.meta ? '<div class="meta">' + a.meta + '</div>' : '');
  } else {
    /* 首位版多露要点；非首位只给结论。超长由 CSS 省略号缩略，不再做卡内展开 */
    body = '<div class="ans' + (first ? ' first' : '') + (a.nowver ? ' nowver' : '') + '">' + a.ans
      + ((first && a.more) ? a.more : '') + '</div>';
  }
  /* 线上版：答案下面还有「两张图 + 参考来源」 */
  if (a.imgs) body += '<div class="aiimgs">' + a.imgs.map(cls => '<span class="thumb ' + cls + '"></span>').join('') + '</div>';
  if (a.source) body += '<div class="aisrc"><span class="thumb ' + a.source[0] + '"></span>'
    + '<div class="si"><div class="st">参考来源</div><div class="sd">' + a.source[1] + '</div></div></div>';
  if (first && a.rel) body += '<div class="airel"><div class="rhead">关联资源</div>' + a.rel.map(r =>
      '<div class="rr hot" data-go="S6" data-say="点关联资源「' + r[1] + '」"><div class="thumb ' + r[0] + '"></div>'
      + '<div class="li"><div class="a">' + r[1] + '</div><div class="b">' + r[2] + '</div></div>'
      + '<div class="pr">' + r[3] + '</div></div>').join('') + '</div>';
  return '<div class="aicard' + (a.nowver ? ' nowver' : '') + '"><div class="h"><div class="ava">🤖</div><div class="tt">' + a.title
    + '</div><div class="tag' + (a.nowver ? ' gray' : '') + '">' + a.tag + '</div></div>'
    + body + '<div class="btn hot" data-s2="entry" data-say="点卡上「' + (a.btn || btnLabel || '查看全部') + '」">'
    + (btnLabel || a.btn || '查看全部 ›') + '</div></div>';
};

const CANNED = {};
Object.keys(SC).forEach((id) => { const cv = SC[id].convo; CANNED[cv.entry.q] = cv.entry.a; CANNED[cv.ask.q] = cv.ask.a; });
Object.keys(CANNED_EXTRA).forEach((k) => { CANNED[k] = CANNED_EXTRA[k]; });

function answerOf(q) {
  return CANNED[q] || ASK_ANS[q] || ASK_ANS[q.replace(/？$/, '')] || '（原型示意：这里会给出该问题的回答）';
}

function setConvo(id, role, q) {
  const c = SC[id].convo[role], res = SC[id].plan.res, resNotes = SC[id].plan.resNotes;
  convoKey = role;
  convo = [q ? { q:q, a:answerOf(q), res:res, resNotes:resNotes } : { q:c.q, a:c.a, res:res, resNotes:resNotes }];
  convoChips = c.chips.slice();
  const i = convoChips.indexOf(q);
  if (i >= 0) convoChips.splice(i, 1);
}

function logRow(say, to) {
  const box = $('log'), empty = box.querySelector('.muted');
  if (empty) box.innerHTML = '';
  const st = stateOf(to);
  const row = document.createElement('div');
  row.className = 'logrow';
  row.innerHTML = '<span class="n">' + step + '</span>' + (say || '点了一下')
    + ' <span class="to">→ ' + (st ? String(st.name).split('（')[0] : to) + '</span>';
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function smoothBottom() {
  const sc = $('devNext').querySelector('.screen');
  if (sc) sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' });
}

function dirOf(from, to) {
  const ai = (k) => k.indexOf('S') === 0 || k === 'EXIT';
  if (ai(to) && !ai(from)) return 'animR';
  if (!ai(to) && ai(from)) return 'animL';
  return 'animF';
}

function render(anim) {
  const st = stateOf(cur) || {};
  const note = AI_STATES.indexOf(cur) >= 0
    ? '<div class="empty-note"><div style="line-height:1.8">现在没有这个页面<span style="display:block;font-size:12.5px;color:#9aa8a1;margin-top:8px">线上没有 AI 承接页 / 行程视图</span></div></div>' : '';
  $('devNow').innerHTML = '<div class="page">' + stateOf(scene.now).html() + note + '</div>';
  $('devNext').innerHTML = '<div class="page">' + st.html() + '</div>';
  const pg = $('devNext').querySelector('.page');
  if (pg && anim) {
    if (anim === 'animF') {
      pg.classList.add('animF');                       /* 平级切换：整页淡入 */
    } else {
      const ct = pg.querySelector('.content'); if (ct) ct.classList.add(anim);            /* 只有内容滑 */
      const tp = pg.querySelector('.searchrow, .titlerow'); if (tp) tp.classList.add('fade-in'); /* 搜索框 → 标题：渐显 */
      const bt = pg.querySelector('.bottom'); if (bt) bt.classList.add('fade-in');
    }
  }
  $('stateName').innerHTML = st.name + '<small>' + st.desc + '</small>';
  const c = st.ctx;
  $('ctxBox').innerHTML = '<b>上下文包（界面上不显示，这里可查）</b><br>' + (typeof c === 'function' ? c() : (c || '—'));
}

let swapT = null;
function go(id, say) {
  if (!stateOf(id)) return;
  const from = cur;
  cur = id; step++;
  if (AI_MEM.indexOf(id) >= 0) lastAI = id;
  logRow(say, id);
  const anim = dirOf(from, id);
  const pg = $('devNext').querySelector('.page');
  const rows = pg ? pg.querySelectorAll('.content, .searchrow, .titlerow, .bottom') : [];
  clearTimeout(swapT);
  if (anim !== 'animF' && pg) {
    Array.prototype.forEach.call(rows, function (el) { el.classList.add('fade-out'); });  /* tab 栏不动 */
    swapT = setTimeout(function () { render(anim); }, 130);
  } else {
    render(anim);
  }
}

document.addEventListener('click', (e) => {
  if (e.target.closest('#devNow')) { step++; logRow('点「现在」这一侧：这条路现在走不通（线上没有这个入口）', cur); render(); return; }
  const el = e.target.closest('[data-go],[data-back],[data-ai],[data-s2],[data-ask]');
  if (!el) return;
  if (el.dataset.back !== undefined) {
    if (RET === 'A') go('EXIT', '按返回（行为 A：直接退出落地页）');
    else go(scene.start, '按返回（行为 B：回上一个 tab）');
    return;
  }
  if (el.dataset.s2 !== undefined) {
    setConvo(scene.id, el.dataset.s2 === 'entry' ? 'entry' : 'ask', el.dataset.q);
    go('S2', el.dataset.say);
    return;
  }
  if (el.dataset.ask !== undefined) {
    const q = el.dataset.ask;
    convo.push({ q:q, a:answerOf(q) });
    step++; logRow('追问「' + q + '」→ 在同一个对话里追加第 ' + convo.length + ' 轮', 'S2');
    window.__popLast = true; render(null); window.__popLast = false;
    smoothBottom(); return;
  }
  if (el.dataset.ai !== undefined) {
    /* 规则：先看有没有"上次停留的视图"，再看页内首位是不是 AI 卡 */
    if (lastAI) { go(lastAI, el.dataset.say + '（回到上次的视图）'); return; }
    if (SC[scene.id].aiFirst) {                       // 头位是 AI 回复卡 → 延续那张卡的问题+答案
      setConvo(scene.id, 'entry');
      go('S2', el.dataset.say + '（延续页内那张 AI 卡）');
      return;
    }
    go('S1', el.dataset.say + '（空态：给预设问题）');   // 头位是实体模块 → 空态
    return;
  }
  if (el.dataset.note) {
    curNote = el.dataset.note; curNoteAuthor = el.dataset.noteAuthor || '';
    curNoteLike = el.dataset.noteLike || ''; curNoteCover = el.dataset.noteCover || 'pack';
  }
  go(el.dataset.go, el.dataset.say);
});

/* 开关 */
$('swHot').checked = true; document.body.classList.add('showhot');
$('swHot').addEventListener('change', (e) => document.body.classList.toggle('showhot', e.target.checked));
$('swCtx').addEventListener('change', (e) => { $('ctxWrap').style.display = e.target.checked ? 'block' : 'none'; });
$('swTicket').addEventListener('change', (e) => {
  HAS_TICKET = e.target.checked;
  applySta();
  if (scene.id === 'sta') setConvo('sta', 'entry');   /* 条件变了，对话也跟着换成对应那套 */
  step++; logRow('把「已订票」切到 ' + (HAS_TICKET ? '是（出现行程服务卡；AI 卡＝提前多久到机场）' : '否（回到 6 宫格；AI 卡＝南京出发，飞到哪便宜）'), cur);
  render();
});
$('segRet').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  RET = b.dataset.ret;
  Array.prototype.forEach.call($('segRet').children, (x) => x.classList.toggle('on', x === b));
  step++; logRow('把返回行为切到 ' + RET, cur); render();
});

/* 场景列表 */
$('scenes').innerHTML = SCENES.map((s, i) =>
  '<button class="scene-btn' + (i === 0 ? ' on' : '') + '" data-scene="' + s.id + '">'
  + '<b>' + s.label + '</b><small>' + s.sub + '</small></button>').join('');
$('scenes').addEventListener('click', (e) => {
  const b = e.target.closest('[data-scene]'); if (!b) return;
  scene = SCENES.filter((s) => s.id === b.dataset.scene)[0];
  Array.prototype.forEach.call($('scenes').children, (x) => x.classList.toggle('on', x === b));
  cur = scene.start; step = 0; lastAI = null;
  setConvo(scene.id, 'entry');
  $('log').innerHTML = '';
  step = 1; logRow('进入「' + scene.label + '」的落地页', cur);
  render('animF');
});

/* 初始 */
const qp = new URLSearchParams(location.search);
const _sc = SCENES.filter((x) => x.id === qp.get('scene'))[0];
if (_sc) { scene = _sc; cur = _sc.start;
  Array.prototype.forEach.call($('scenes').children, (x) => x.classList.toggle('on', x.dataset.scene === _sc.id)); }
applySta();
setConvo(scene.id, 'entry');
if (qp.get('s') && stateOf(qp.get('s'))) cur = qp.get('s');
step = 1; logRow('进入「' + scene.label + '」的落地页', cur);
render();
</script>
